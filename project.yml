name: Lily
options:
  bundleIdPrefix: dev.lily
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
packages:
  LilyKit:
    url: https://github.com/Lily-browser/LilyKit.git
    exactVersion: 0.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO # simulator builds only until the Developer Program is bought
targets:
  Lily:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: LilyKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lily
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lily.browser.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  LilyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Lily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lily.browser.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lily:
    build: { targets: { Lily: all } }
    test: { targets: [LilyTests] }
