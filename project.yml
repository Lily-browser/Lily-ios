name: Lily
options:
  bundleIdPrefix: dev.lily
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
packages:
  LilyKit:
    url: https://github.com/Lily-browser/LilyKit.git
    exactVersion: 1.1.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic # simulator needs no team; a free Apple ID (Personal Team) is enough for your own device
targets:
  Lily:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - package: LilyKit
      - target: LilyShare
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lily
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for calls and voice messages.
        NSLocationWhenInUseUsageDescription: Websites you allow can ask for your location, for example for maps.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.lily.browser.ios.link
            CFBundleURLSchemes: [lily]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LILY_BUNDLE_ID) # default in Config/Base.xcconfig, overridable in Config/Local.xcconfig
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LilyShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Lily
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LILY_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  LilyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Lily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LILY_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lily:
    build: { targets: { Lily: all } }
    test: { targets: [LilyTests] }
